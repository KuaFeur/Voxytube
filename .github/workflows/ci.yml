name: Rust CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voxytube
          POSTGRES_PASSWORD: voxytube_test_password
          POSTGRES_DB: voxytube_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxytube -d voxytube_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://voxytube:voxytube_test_password@localhost:5432/voxytube_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format source
        run: cargo fmt --all
      - name: Compile
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -A warnings
  egg-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Pelican Egg JSON
        run: python3 -m json.tool deploy/pelican/egg-voxytube.json >/dev/null
      - name: Validate container entrypoint syntax
        run: bash -n docker/entrypoint.sh
