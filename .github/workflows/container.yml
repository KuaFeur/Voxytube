name: Build and publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kuafeur/voxytube
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        if: github.ref == 'refs/heads/main'
        run: |
          docker run -d --name voxytube-smoke \
            -e PUBLIC_CALLBACK_URL=https://example.invalid/websub \
            -e API_TOKEN=smoke-test-token-with-more-than-32-characters \
            -p 18080:8080 ghcr.io/kuafeur/voxytube:latest
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              docker logs voxytube-smoke
              docker rm -f voxytube-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs voxytube-smoke
          docker rm -f voxytube-smoke || true
          exit 1
